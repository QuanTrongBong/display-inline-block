<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bố cục với display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Bố cục trang web với display</h1>
    <nav aria-label="Điều hướng chính">
      <a href="#home">Trang chủ</a>
      <a href="#about">Giới thiệu</a>
      <a href="#services">Dịch vụ</a>
      <a href="#contact">Liên hệ</a>
    </nav>
  </header>

  <main id="home">
    <section class="columns" aria-label="Ba cột nội dung">
      <div class="box" id="about">
        <h2>Cột 1</h2>
        <p>Khám phá thông tin giới thiệu.</p>
      </div>
      <div class="box" id="services">
        <h2>Cột 2</h2>
        <p>Tìm hiểu các dịch vụ.</p>
      </div>
      <div class="box" id="contact">
        <h2>Cột 3</h2>
        <p>Kết nối với chúng tôi.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>Bản quyền © 2026</p>
  </footer>
</body>
</html>
